name: Build

on:
  workflow_dispatch:
  push:
    branches: [ 'feat/**', 'fix/**' ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Check signature (testkey, v1 + v2 + v3)
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/apksigner" verify -v --print-certs "$APK" | tee verify.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' verify.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' verify.txt
          grep -qi 'SHA-256 digest: a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc' verify.txt

      - name: Name the APK
        run: |
          set -e
          SHA=$(git rev-parse --short=8 HEAD)
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/WrtPanel-${VER}-${SHA}.apk"
          cd out && sha256sum *.apk | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: WrtPanel-${{ github.sha }}
          path: out/
          retention-days: 30
