name: UI tour

# Boots an Android emulator next to a stock OpenWrt 25.12.6 test router (Docker, generic data),
# logs the app in, opens every page of the router's menu and uploads screenshots + logcat.
# Runs on demand, or on a push to feat/app whose commit message contains "[tour]"
# (workflow_dispatch only works once this file is on the default branch).
on:
  workflow_dispatch:
  push:
    branches: [ 'feat/app' ]

jobs:
  tour:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tour]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start test router
        run: sh ci/testrouter/start.sh

      - name: Build test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run the tour on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb logcat -c || true
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.routerUrl=http://10.0.2.2:8088 || echo TOUR_FAILED > tour-failed.txt
            mkdir -p tour/screens
            adb pull /data/local/tmp/wrtpanel-screens tour/screens || true
            adb logcat -d > tour/logcat.txt || true
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' > tour/focus.txt || true

      - name: Router logs
        if: always()
        run: |
          mkdir -p tour
          docker exec wrtpanel-router logread > tour/router-logread.txt 2>&1 || true
          docker exec wrtpanel-router cat /tmp/stub-calls.log > tour/router-stub-calls.txt 2>&1 || true
          docker logs wrtpanel-router > tour/router-container.txt 2>&1 || true
          cp -r app/build/outputs/androidTest-results tour/ 2>/dev/null || true
          cp -r app/build/reports/androidTests tour/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tour-${{ github.sha }}
          path: tour/
          retention-days: 14

      - name: Fail if the tour failed
        run: test ! -f tour-failed.txt
