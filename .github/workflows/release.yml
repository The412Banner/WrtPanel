name: Release

# Manual only. Builds the release APK from the given commit, checks the testkey signature and
# publishes a GitHub release with the APK (the in-app updater reads these releases).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, e.g. v1.0.0 or v1.0.0-pre1 (must match versionName in app/build.gradle.kts)'
        required: true
      sha:
        description: 'Full 40-character commit SHA to build and tag'
        required: true
      prerelease:
        description: 'Mark as pre-release (test build)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Check inputs
        run: |
          set -e
          echo "${{ inputs.sha }}" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="${{ inputs.tag }}"
          test "${TAG#v}" = "$VER" || { echo "tag $TAG does not match versionName $VER"; exit 1; }
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then echo "tag $TAG exists"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Sign check and name
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if ! unzip -l "$APK" | grep -qE 'META-INF/[^/]+\.(SF|RSA)$'; then
            "$BT/apksigner" sign --ks keystore/testkey.p12 --ks-type PKCS12 --ks-pass pass:android \
              --ks-key-alias testkey --key-pass pass:android --min-sdk-version 21 \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$APK.signed" "$APK"
            mv "$APK.signed" "$APK"
          fi
          "$BT/apksigner" verify -v --print-certs --min-sdk-version 21 "$APK" | tee verify.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' verify.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' verify.txt
          grep -qi 'SHA-256 digest: a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc' verify.txt
          mkdir -p out
          cp "$APK" "out/WrtPanel-${{ inputs.tag }}.apk"
          cd out && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES=release-notes.md
          [ -f "docs/release-notes/${{ inputs.tag }}.md" ] && cp "docs/release-notes/${{ inputs.tag }}.md" $NOTES || echo "WrtPanel ${{ inputs.tag }}" > $NOTES
          PRE=""
          [ "${{ inputs.prerelease }}" = "true" ] && PRE="--prerelease"
          gh release create "${{ inputs.tag }}" out/*.apk out/SHA256SUMS \
            --target "${{ inputs.sha }}" --title "WrtPanel ${{ inputs.tag }}" --notes-file $NOTES $PRE
